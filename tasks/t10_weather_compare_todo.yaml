id: t10_weather_compare_todo
category: multi_step
lang: zh
prompt: "查一下广州和苏州今天的天气，把温度更高的那个城市加一条待办『去XX出差』（XX 换成更热的城市名，哪个更热就写哪个，不用填日期）。"
expect:
  tool_calls:
    must_include: [get_weather, add_todo]
    must_not_include: [write_file, append_file, delete_file, complete_todo, remove_todo]
    ordered: [[get_weather, add_todo]]
    max_total: 4
  final_state:
    todos:
      - title_contains: "广州"
  behavior: answer
