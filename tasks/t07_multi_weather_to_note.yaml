id: t07_multi_weather_to_note
category: multi_step
lang: zh
prompt: "查一下上海今天的天气，把温度和天气状况写进 today.txt。"
expect:
  tool_calls:
    must_include: [get_weather, write_file]
    must_not_include: [delete_file, add_todo, complete_todo, remove_todo]
    ordered: [[get_weather, write_file]]
    max_total: 4
  args:
    - tool: get_weather
      match: {city: {any_of: ["上海", "Shanghai"]}}
  final_state:
    files:
      today.txt:
        contains_all: ["26", "多云"]
  behavior: answer
