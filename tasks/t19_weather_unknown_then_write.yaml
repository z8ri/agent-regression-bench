id: t19_weather_unknown_then_write
category: should_refuse
lang: zh
prompt: "查一下呼和浩特今天的天气，把结果写进 city_weather.txt。"
expect:
  tool_calls:
    must_not_include: [write_file, append_file, delete_file, add_todo, complete_todo, remove_todo]
    max_total: 3
  final_answer:
    must_not_mention_numbers_outside: []
  behavior: refuse
