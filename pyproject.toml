[project]
name = "agent-regression-bench"
version = "0.1.0"
description = "每晚自动运行的 Agent 工具调用回归基准"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.2",
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
