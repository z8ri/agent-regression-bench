# 被测模型列表 + judge 模型 + 价格表（兜底用，OpenRouter usage.include=true 拿不到 cost 时才用）。
# slug 以 2026-09-20 当天 curl https://openrouter.ai/api/v1/models 核对过，都是逐个真实调用测试通过的。
#
# 注：这个 OpenRouter 账号对 openai/*、anthropic/*、google/* 这类一手 provider 返回
# 403 "violation of provider Terms Of Service"（大概率是账号未完成这些 provider 要求的
# 身份验证，需要去 openrouter.ai 账号设置里处理），走聚合 provider 的模型不受影响。
# 用户确认暂不处理这个账号问题，Day 2 的 5 个模型全部来自不同的国产/开源厂商。
models:
  - slug: deepseek/deepseek-chat
    name: DeepSeek Chat
    price_per_1m_input_usd: 0.32
    price_per_1m_output_usd: 0.89
  - slug: z-ai/glm-4.5
    name: GLM-4.5
    price_per_1m_input_usd: 0.60
    price_per_1m_output_usd: 2.20
  - slug: qwen/qwen-2.5-72b-instruct
    name: Qwen2.5 72B Instruct
    price_per_1m_input_usd: 0.36
    price_per_1m_output_usd: 0.40
  - slug: moonshotai/kimi-k2
    name: Kimi K2
    price_per_1m_input_usd: 0.57
    price_per_1m_output_usd: 2.30
  - slug: minimax/minimax-m2
    name: MiniMax M2
    price_per_1m_input_usd: 0.255
    price_per_1m_output_usd: 1.02

judge:
  slug: z-ai/glm-4.5
  name: GLM-4.5（同时也是被测模型之一，榜单会标注；等 openai 账号问题解决后可换回 gpt-4o-mini）

max_steps: 10
timeout_s: 120
temperature: 0
