name: nightly

on:
  schedule:
    # 0 3 * * * UTC，每晚跑；周日（ISO 星期 7）额外用 --repeat 3 看方差
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python + deps
        run: |
          uv python install 3.11
          uv sync

      - name: Decide repeat count（周日 3 次，其它天 1 次）
        id: repeat
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "n=3" >> "$GITHUB_OUTPUT"
          else
            echo "n=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python -m bench.run --repeat ${{ steps.repeat.outputs.n }}

      - name: Generate report
        run: uv run python -m bench.report --repeat ${{ steps.repeat.outputs.n }}

      - name: Run tests
        run: uv run pytest -q

      - name: Commit and push results
        run: |
          git config user.name "agent-regression-bench-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet || git commit -m "nightly: $(date -u +%Y-%m-%d) run"
          git push
